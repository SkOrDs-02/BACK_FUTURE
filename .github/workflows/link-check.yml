name: Link check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

# Новий пуш у ту саму гілку скасовує попередній прогін: паралельні прогони
# перевірки посилань впираються в rate limit GitHub і падають.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Dump fact source URLs
        run: npm run dump:source-urls

      # Посилання на власні PR у docs/ (історія проєкту) не перевіряємо:
      # GitHub періодично віддає на важкі сторінки PR 502 і валить job.
      - name: Check Markdown and built HTML links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir "$GITHUB_WORKSPACE/dist"
            --exclude "https://back-future.example.com/.*"
            --exclude "https://github.com/(?i:skords-0[12])/BACK_FUTURE/pull/.*"
            --exclude-path './dist/.*\.html'
            --exclude-path './content/.*'
            './README.md'
            './docs/**/*.md'

      - name: Check fact source URLs
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: >-
            --verbose
            --no-progress
            './dist/.fact-source-urls.md'
